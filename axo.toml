project_name = "sunshine"

[tasks]
build = "swift build"
example = "cd Examples/SunshineExample && strudel run"
test = "swift test"
clean = "swift package clean"
fmt = "swift format -i --recursive ."
"readme:lint" = "rumdl check ."
"readme:fmt" = "rumdl fmt ."

[global_packages]
"rvben/rumdl" = "^0.2.52"
